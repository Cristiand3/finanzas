<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanzas</title>
<meta name="description" content="Control de gastos, ahorro y préstamos">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f4f6f5; --card:#ffffff; --ink:#15201d; --muted:#65736f; --line:#e2e8e6;
  --brand:#0f766e; --brand-ink:#ffffff; --brand-soft:#dff3ef;
  --in:#15803d; --out:#c2410c; --save:#1d4ed8; --warn:#b45309;
  --radius:16px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1412; --card:#16201d; --ink:#e8efec; --muted:#93a39e; --line:#26332f;
    --brand:#2dd4bf; --brand-ink:#062b27; --brand-soft:#123a35;
    --in:#4ade80; --out:#fb923c; --save:#60a5fa; --warn:#fbbf24;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1412; --card:#16201d; --ink:#e8efec; --muted:#93a39e; --line:#26332f;
  --brand:#2dd4bf; --brand-ink:#062b27; --brand-soft:#123a35;
  --in:#4ade80; --out:#fb923c; --save:#60a5fa; --warn:#fbbf24;
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px}
.month{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month h1{font-size:20px;margin:0;text-align:center;flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.card h2{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .l{font-size:12px;color:var(--muted)} .stat .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.big .v{font-size:28px}
.in{color:var(--in)} .out{color:var(--out)} .save{color:var(--save)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{font-weight:600} .row .s{font-size:12px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}
.catrow{padding:7px 0}
.catrow .h{display:flex;justify-content:space-between;font-size:14px}
.empty{color:var(--muted);text-align:center;padding:18px 0}
.day{font-size:12px;color:var(--muted);font-weight:600;margin:14px 2px 4px;text-transform:capitalize}
.mov{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:6px 0;cursor:pointer}
.dot{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:var(--brand-soft);flex:none}
.mov .m{flex:1;min-width:0}.mov .m .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.mov .m .s{font-size:12px;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in2{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:8px 0 10px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--brand);font-weight:700}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(78px + env(safe-area-inset-bottom));z-index:7;width:58px;height:58px;border-radius:18px;border:0;background:var(--brand);color:var(--brand-ink);font-size:30px;box-shadow:0 6px 18px rgba(15,118,110,.35);cursor:pointer}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--brand);color:var(--brand-ink);font-weight:700;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--out);border:1px solid var(--line)}
.btn.sm{width:auto;padding:8px 12px;font-size:14px}
.btns{display:flex;gap:8px;margin-top:10px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;transform:translateY(100%);transition:transform .22s ease;padding:8px 0 calc(16px + env(safe-area-inset-bottom))}
.sheet.open{transform:none}.scrim.open{display:block}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:0 0 12px;font-size:18px}
label.f{display:block;margin:10px 0}
label.f span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.inp{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:none}
.inp:focus{border-color:var(--brand)}
.amount{font-size:26px;font-weight:700;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:9px 4px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.catgrid button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 4px;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.catgrid button b{font-size:18px}
.catgrid button.on{border-color:var(--brand);background:var(--brand-soft);font-weight:700}
.check{display:flex;gap:10px;align-items:center;margin:10px 0}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;font-weight:600}
.toast.on{opacity:1}
.hint{font-size:12px;color:var(--muted)}
.hidden{display:none!important}
.listedit .row input{flex:1}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="month" id="monthBar">
    <button class="iconbtn" id="prevM" aria-label="Mes anterior">‹</button>
    <h1 id="monthTitle"></h1>
    <button class="iconbtn" id="nextM" aria-label="Mes siguiente">›</button>
  </div>
  <h1 id="plainTitle" class="hidden" style="font-size:20px;margin:6px 0"></h1>
  <div class="chips" id="personChips"></div>
</div></header>

<main class="wrap" id="view"></main>

<button class="fab" id="fab" aria-label="Agregar movimiento">+</button>

<nav class="tabs"><div class="in2" id="tabs"></div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div class="wrap" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" class="hidden">

<script>
/* ============ Datos ============ */
const KEY='finanzas.v1';
const CAT_ICON={'Alimentación':'🛒','Transporte':'🚌','Salud & Estética':'💊','Hogar':'🏠','Ropa & Accesorios':'👕','Entretenimiento':'🎬','Gym & Bienestar':'🏋️','Mascotas':'🐾','Deudas/Cuotas':'💳','T trabajo':'💼','Regalos':'🎁','Otros':'📦'};
const DEFAULT={
  version:1,
  personas:['Persona 1','Persona 2'],
  categorias:Object.keys(CAT_ICON),
  medios:['Efectivo','Débito','Crédito','Transferencia','Mercado Pago','Uala','gocuotas','Cuenta DNI','otro'],
  fuentesIngreso:['Sueldo','Extra','Otros'],
  metas:[
    {id:'m1',nombre:'Fondo de emergencia',objetivo:0},
    {id:'m2',nombre:'Viaje / vacaciones',objetivo:0},
    {id:'m3',nombre:'Proyecto hogar',objetivo:0},
    {id:'m4',nombre:'Ahorro largo plazo',objetivo:0}],
  movs:[],        // {id,tipo:'gasto'|'ingreso'|'ahorro',fecha,persona,desc,cat,monto,medio,cuotas,notas,meta}
  prestamos:[],   // {id,nombre,persona,original,cuotasTotales,cuota,fin}
  pmovs:[]        // {id,prestamoId,fecha,tipo:'Pago'|'Interés'|'Ajuste'|'Pago previo',monto,cuotas,nota}
};
let S=load();
function load(){
  try{const raw=localStorage.getItem(KEY); if(raw) return Object.assign(structuredClone(DEFAULT),JSON.parse(raw));}catch(e){}
  return structuredClone(DEFAULT);
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('No se pudo guardar')} window.SYNC?.push(); }
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ============ Utilidades ============ */
const fmt=n=>'$ '+Math.round(n||0).toLocaleString('es-AR');
const pct=n=>isFinite(n)?Math.round(n*100)+'%':'—';
const parseAmt=s=>{s=String(s||'').replace(/[^\d,.-]/g,'');s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?n:0};
const todayISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const ym=iso=>iso.slice(0,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monthName=k=>{const [y,m]=k.split('-');const s=new Date(+y,+m-1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'});return s[0].toUpperCase()+s.slice(1)};
const dayName=iso=>{const [y,m,d]=iso.split('-');return new Date(+y,+m-1,+d).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'short'})};
const shiftMonth=(k,n)=>{const [y,m]=k.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const sum=(a,f=x=>x.monto)=>a.reduce((t,x)=>t+(+f(x)||0),0);
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1800)}

/* ============ Estado de UI ============ */
const UI={tab:'inicio',month:ym(todayISO()),persona:'Todos'};
try{const u=JSON.parse(sessionStorage.getItem('ui')||'{}');Object.assign(UI,u)}catch(e){}
const saveUI=()=>{try{sessionStorage.setItem('ui',JSON.stringify(UI))}catch(e){}};

const ICONS={
  inicio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  movs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  metas:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>',
  prestamos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>',
  ajustes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'
};
const TABS=[['inicio','Inicio'],['movs','Movimientos'],['metas','Metas'],['prestamos','Préstamos'],['ajustes','Ajustes']];

/* ============ Cálculos ============ */
function monthMovs(k=UI.month,p=UI.persona){return S.movs.filter(m=>ym(m.fecha)===k&&(p==='Todos'||m.persona===p))}
function resumen(k,p){
  const ms=monthMovs(k,p);
  const ing=sum(ms.filter(m=>m.tipo==='ingreso')), gas=sum(ms.filter(m=>m.tipo==='gasto')), aho=sum(ms.filter(m=>m.tipo==='ahorro'));
  return {ing,gas,aho,sob:ing-gas,libre:ing-gas-aho,pctGasto:ing?gas/ing:NaN,n:ms.filter(m=>m.tipo==='gasto').length,ms};
}
function metaAhorrado(id){return sum(S.movs.filter(m=>m.tipo==='ahorro'&&m.meta===id))}
function prestamoCalc(p){
  const mv=S.pmovs.filter(x=>x.prestamoId===p.id);
  const pagos=sum(mv.filter(x=>x.tipo==='Pago')), previos=sum(mv.filter(x=>x.tipo==='Pago previo'));
  const interes=sum(mv.filter(x=>x.tipo==='Interés')), ajuste=sum(mv.filter(x=>x.tipo==='Ajuste'));
  const total=(+p.original||0)+interes+ajuste, pagado=pagos+previos, saldo=total-pagado;
  const cuotasPag=sum(mv.filter(x=>x.tipo==='Pago'||x.tipo==='Pago previo'),x=>x.cuotas);
  const restantes=p.cuotasTotales?Math.max(0,p.cuotasTotales-cuotasPag):null;
  let mesesFin=null;
  if(p.fin){const [fy,fm]=p.fin.split('-').map(Number);const [ty,tm]=ym(todayISO()).split('-').map(Number);mesesFin=Math.max(1,(fy-ty)*12+(fm-tm)+1)}
  const sugerido=p.cuota&&p.cuotasTotales?Math.min(p.cuota,Math.max(0,saldo)):(mesesFin?Math.max(0,saldo)/mesesFin:null);
  const pagoMes=sum(mv.filter(x=>x.tipo==='Pago'&&ym(x.fecha)===UI.month));
  return {mv,total,pagado,saldo,cuotasPag,restantes,sugerido,pagoMes,prog:total?pagado/total:0,mesesFin};
}

/* ============ Render ============ */
function render(){
  const T=UI.tab;
  document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" class="${k===T?'on':''}">${ICONS[k]}${l}</button>`).join('');
  const monthly=T==='inicio'||T==='movs';
  document.getElementById('monthBar').classList.toggle('hidden',!monthly);
  const pt=document.getElementById('plainTitle');pt.classList.toggle('hidden',monthly);
  pt.textContent={metas:'Metas de ahorro',prestamos:'Préstamos y deudas',ajustes:'Ajustes'}[T]||'';
  document.getElementById('monthTitle').textContent=monthName(UI.month);
  const chips=document.getElementById('personChips');
  chips.classList.toggle('hidden',!monthly);
  chips.innerHTML=['Todos',...S.personas].map(p=>`<button class="chip ${p===UI.persona?'on':''}" data-persona="${esc(p)}">${esc(p)}</button>`).join('');
  document.getElementById('fab').classList.toggle('hidden',T==='ajustes');
  const v=document.getElementById('view');
  v.innerHTML=({inicio:vInicio,movs:vMovs,metas:vMetas,prestamos:vPrestamos,ajustes:vAjustes}[T])();
  saveUI();
}

function vInicio(){
  const r=resumen(UI.month,UI.persona);
  const cats=S.categorias.map(c=>({c,v:sum(r.ms.filter(m=>m.tipo==='gasto'&&m.cat===c))})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const max=cats[0]?.v||1;
  const porPersona=UI.persona==='Todos'?`<div class="card"><h2>Por persona</h2>${S.personas.map(p=>{const x=resumen(UI.month,p);return `<div class="row"><div><div class="t">${esc(p)}</div><div class="s">Ingresos ${fmt(x.ing)} · Ahorro ${fmt(x.aho)}</div></div><div class="num out">${fmt(x.gas)}</div></div>`}).join('')}</div>`:'';
  const deudas=S.prestamos.map(p=>({p,c:prestamoCalc(p)}));
  const saldoDeuda=sum(deudas,d=>d.c.saldo);
  const metas=S.metas.map(m=>{const a=metaAhorrado(m.id);return `<div class="catrow"><div class="h"><span>${esc(m.nombre)}</span><span class="num">${fmt(a)}${m.objetivo?` <span class="hint">/ ${fmt(m.objetivo)}</span>`:''}</span></div><div class="bar"><i style="width:${m.objetivo?Math.min(100,a/m.objetivo*100):0}%;background:var(--save)"></i></div></div>`}).join('');
  return `
  <div class="card">
    <div class="stat big"><div class="l">Libre este mes (ingresos − gastos − ahorro)</div><div class="v ${r.libre<0?'out':''}">${fmt(r.libre)}</div></div>
    <div class="hero" style="margin-top:12px">
      <div class="stat"><div class="l">Ingresos</div><div class="v in">${fmt(r.ing)}</div></div>
      <div class="stat"><div class="l">Gastos</div><div class="v out">${fmt(r.gas)}</div></div>
      <div class="stat"><div class="l">Ahorro a metas</div><div class="v save">${fmt(r.aho)}</div></div>
      <div class="stat"><div class="l">% del ingreso gastado</div><div class="v">${pct(r.pctGasto)}</div></div>
    </div>
    <div class="hint" style="margin-top:8px">Sobrante ${fmt(r.sob)} · ${r.n} gasto${r.n===1?'':'s'}</div>
  </div>
  ${porPersona}
  <div class="card"><h2>Gasto por categoría</h2>
    ${cats.length?cats.map(x=>`<div class="catrow"><div class="h"><span>${CAT_ICON[x.c]||'•'} ${esc(x.c)}</span><span class="num">${fmt(x.v)} <span class="hint">${pct(x.v/r.gas)}</span></span></div><div class="bar"><i style="width:${x.v/max*100}%"></i></div></div>`).join(''):'<div class="empty">Todavía no hay gastos este mes.<br>Tocá <b>+</b> para cargar el primero.</div>'}
  </div>
  <div class="card"><h2>Metas de ahorro</h2>${metas||'<div class="empty">Sin metas</div>'}</div>
  ${deudas.length?`<div class="card"><h2>Deudas</h2><div class="row"><div class="t">Saldo total</div><div class="num out">${fmt(saldoDeuda)}</div></div>
    <div class="row"><div class="t">Pagado este mes</div><div class="num">${fmt(sum(deudas,d=>d.c.pagoMes))}</div></div>
    <div class="row"><div class="t">Pago sugerido / mes</div><div class="num">${fmt(sum(deudas,d=>d.c.sugerido||0))}</div></div></div>`:''}
  `;
}

function vMovs(){
  const f=UI.movFilter||'todos';
  let ms=monthMovs().filter(m=>f==='todos'||m.tipo===f).sort((a,b)=>b.fecha.localeCompare(a.fecha)||(b.id>a.id?1:-1));
  const seg=`<div class="seg" style="margin-top:12px">${[['todos','Todos'],['gasto','Gastos'],['ingreso','Ingresos'],['ahorro','Ahorro']].map(([k,l])=>`<button data-movfilter="${k}" class="${k===f?'on':''}">${l}</button>`).join('')}</div>`;
  if(!ms.length) return seg+'<div class="empty" style="padding:40px 0">No hay movimientos en este mes.</div>';
  let out=seg,last='';
  for(const m of ms){
    if(m.fecha!==last){out+=`<div class="day">${dayName(m.fecha)}</div>`;last=m.fecha}
    const icon=m.tipo==='gasto'?(CAT_ICON[m.cat]||'📦'):m.tipo==='ingreso'?'💰':'🎯';
    const title=m.desc||(m.tipo==='gasto'?m.cat:m.tipo==='ingreso'?m.cat||'Ingreso':(S.metas.find(x=>x.id===m.meta)?.nombre||'Ahorro'));
    const sub=[m.persona,m.tipo==='gasto'?m.cat:null,m.medio,m.cuotas?('cuota '+m.cuotas):null].filter(Boolean).map(esc).join(' · ');
    const cls=m.tipo==='gasto'?'out':m.tipo==='ingreso'?'in':'save';
    out+=`<div class="mov" data-edit="${m.id}"><div class="dot">${icon}</div><div class="m"><div class="t">${esc(title)}</div><div class="s">${sub}</div></div><div class="num ${cls}">${m.tipo==='gasto'?'−':'+'}${fmt(m.monto)}</div></div>`;
  }
  return out;
}

function vMetas(){
  const tot=sum(S.metas,m=>metaAhorrado(m.id)), obj=sum(S.metas,m=>m.objetivo);
  return `<div class="card"><div class="stat big"><div class="l">Total ahorrado</div><div class="v save">${fmt(tot)}</div></div>${obj?`<div class="bar"><i style="width:${Math.min(100,tot/obj*100)}%;background:var(--save)"></i></div><div class="hint" style="margin-top:6px">${pct(tot/obj)} de ${fmt(obj)}</div>`:''}</div>
  ${S.metas.map(m=>{const a=metaAhorrado(m.id);const falta=Math.max(0,(m.objetivo||0)-a);

/* ============ Hoja (formularios) ============ */
function openSheet(html){document.getElementById('sheetBody').innerHTML=html;document.getElementById('scrim').classList.add('open');document.getElementById('sheet').classList.add('open');document.getElementById('sheet').scrollTop=0}
function closeSheet(){document.getElementById('scrim').classList.remove('open');document.getElementById('sheet').classList.remove('open')}
const opts=(arr,sel)=>arr.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('');

let draft=null;
function movForm(m){
  const nuevo=!m;
  const defPersona=UI.persona!=='Todos'?UI.persona:(UI.lastPersona||S.personas[0]);
  const defDate=ym(todayISO())===UI.month?todayISO():UI.month+'-01';
  draft=m?{...m}:{id:null,tipo:'gasto',fecha:defDate,persona:defPersona,desc:'',cat:S.categorias[0],monto:'',medio:UI.lastMedio||S.medios[0],cuotas:'',notas:'',meta:S.metas[0]?.id};
  if(draft.tipo==='ingreso'&&!S.fuentesIngreso.includes(draft.cat))draft.cat=draft.cat||S.fuentesIngreso[0];
  drawMovForm(nuevo);
}
function drawMovForm(nuevo){
  const d=draft;
  const typeSeg=`<div class="seg">${[['gasto','Gasto'],['ingreso','Ingreso'],['ahorro','Ahorro']].map(([k,l])=>`<button data-tipo="${k}" class="${k===d.tipo?'on':''}">${l}</button>`).join('')}</div>`;
  let fields='';
  if(d.tipo==='gasto'){
    fields=`<label class="f"><span>Categoría</span></label><div class="catgrid">${S.categorias.map(c=>`<button type="button" data-cat="${esc(c)}" class="${c===d.cat?'on':''}"><b>${CAT_ICON[c]||'•'}</b>${esc(c)}</button>`).join('')}</div>
    <label class="f"><span>Descripción</span><input class="inp" id="fDesc" value="${esc(d.desc)}" placeholder="Ej: súper, nafta, farmacia"></label>
    <div class="grid2"><label class="f"><span>Medio de pago</span><select class="inp" id="fMedio">${opts(S.medios,d.medio)}</select></label>
    <label class="f"><span>Cuotas</span><input class="inp" id="fCuotas" value="${esc(d.cuotas)}" placeholder="Ej: 1/3"></label></div>`;
  }else if(d.tipo==='ingreso'){
    fields=`<label class="f"><span>Tipo de ingreso</span><select class="inp" id="fCat">${opts(S.fuentesIngreso,d.cat)}</select></label>
    <label class="f"><span>Descripción (opcional)</span><input class="inp" id="fDesc" value="${esc(d.desc)}"></label>`;
  }else{
    fields=`<label class="f"><span>Meta</span><select class="inp" id="fMeta">${S.metas.map(x=>`<option value="${x.id}" ${x.id===d.meta?'selected':''}>${esc(x.nombre)}</option>`).join('')}</select></label>
    <p class="hint">Para registrar un retiro de la meta, cargá el monto en negativo (ej: −50000).</p>`;
  }
  openSheet(`<h3>${nuevo?'Nuevo movimiento':'Editar movimiento'}</h3>${typeSeg}
   <label class="f"><span>Monto ($)</span><input class="inp amount" id="fMonto" inputmode="decimal" value="${d.monto!==''?Math.round(d.monto*100)/100:''}" placeholder="0" autocomplete="off"></label>
   <div class="grid2"><label class="f"><span>Fecha</span><input type="date" class="inp" id="fFecha" value="${d.fecha}"></label>
   <label class="f"><span>Quién</span><select class="inp" id="fPersona">${opts(S.personas,d.persona)}</select></label></div>
   ${fields}
   <label class="f"><span>Notas</span><input class="inp" id="fNotas" value="${esc(d.notas)}"></label>
   <button class="btn" data-action="saveMov">${nuevo?'Guardar':'Guardar cambios'}</button>
   ${nuevo?'':'<div class="btns"><button class="btn danger" data-action="delMov">Eliminar</button><button class="btn ghost" data-action="dupMov">Duplicar</button></div>'}
   <div class="btns"><button class="btn ghost" data-action="close">Cancelar</button></div>`);
  if(nuevo) setTimeout(()=>document.getElementById('fMonto')?.focus(),250);
}
function readMovForm(){
  const g=id=>document.getElementById(id);
  draft.monto=parseAmt(g('fMonto').value)||'';draft.fecha=g('fFecha').value||todayISO();draft.persona=g('fPersona').value;draft.notas=g('fNotas').value.trim();
  if(g('fDesc'))draft.desc=g('fDesc').value.trim();
  if(g('fMedio'))draft.medio=g('fMedio').value;
  if(g('fCuotas'))draft.cuotas=g('fCuotas').value.trim();
  if(g('fCat'))draft.cat=g('fCat').value;
  if(g('fMeta'))draft.meta=g('fMeta').value;
}
function saveMov(){
  readMovForm();
  if(!draft.monto){toast('Ingresá un monto');return}
  const m={id:draft.id||uid(),tipo:draft.tipo,fecha:draft.fecha,persona:draft.persona,monto:+draft.monto,notas:draft.notas,desc:draft.desc||''};
  if(m.tipo==='gasto'){Object.assign(m,{cat:draft.cat,medio:draft.medio,cuotas:draft.cuotas});UI.lastMedio=draft.medio}
  if(m.tipo==='ingreso')m.cat=draft.cat;
  if(m.tipo==='ahorro')m.meta=draft.meta;
  UI.lastPersona=m.persona;
  const i=S.movs.findIndex(x=>x.id===m.id);
  if(i>=0)S.movs[i]=m;else S.movs.push(m);
  save();closeSheet();
  if(ym(m.fecha)!==UI.month){UI.month=ym(m.fecha)}
  render();toast(i>=0?'Cambios guardados':'Guardado ✓');
}

/* ============ Exportar / importar ============ */
function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportCSV(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['Fecha','Tipo','Persona','Descripción','Categoría / Meta','Monto','Medio de pago','Cuotas','Notas']];
  S.movs.filter(m=>ym(m.fecha)===UI.month).sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(m=>rows.push([m.fecha,m.tipo,m.persona,m.desc,m.tipo==='ahorro'?(S.metas.find(x=>x.id===m.meta)?.nombre||''):m.cat,String(m.monto).replace('.',','),m.medio||'',m.cuotas||'',m.notas||'']));
  download(`finanzas-${UI.month}.csv`,'﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n'),'text/csv');
}
function syncCard(){
  const Y=window.SYNC;
  if(!Y) return `<div class="card"><h2>Compartir entre celulares</h2><p class="hint" style="margin:0">Cargando…</p></div>`;
  if(!Y.enabled) return `<div class="card"><h2>Compartir entre celulares</h2><p class="hint" style="margin:0">La sincronización todavía no está configurada.</p></div>`;
  const st={ok:'🟢 Sincronizado',offline:'🟡 Sin conexión: se sincroniza al volver',conectando:'⏳ Conectando…',error:'🔴 '+(Y.error||'Error de conexión')}[Y.state]||'';
  if(Y.hid) return `<div class="card"><h2>Hogar compartido</h2>
    <div class="row"><div><div class="t">${st}</div><div class="s">Todo lo que carguen en cualquiera de los celulares aparece en el otro.</div></div></div>
    <button class="btn" data-action="shareHogar">Invitar a otro celular</button>
    <p class="hint">El enlace da acceso a todos los datos: compartilo solo con tu pareja.</p>
    <div class="btns"><button class="btn danger" data-action="leaveHogar">Desconectar este celular</button></div></div>`;
  return `<div class="card"><h2>Compartir entre celulares</h2>
    <p class="hint" style="margin-top:0">Creá un hogar en un celular y mandá la invitación al otro. Los datos cargados hasta ahora en este celular pasan al hogar.</p>
    <button class="btn" data-action="createHogar">Crear hogar compartido</button>
    <label class="f"><span>¿Te invitaron? Pegá el enlace o el código</span><input class="inp" id="joinCode" placeholder="https://… o código"></label>
    <button class="btn ghost" data-action="joinHogar">Unirme al hogar</button></div>`;
}
function importData(obj){
  if(!obj||!Array.isArray(obj.movs)){toast('Archivo no válido');return}
  if(!confirm('Esto reemplaza los datos actuales de este celular por los del archivo. ¿Continuar?'))return;
  S=Object.assign(structuredClone(DEFAULT),obj);save();render();toast('Datos restaurados ✓');
}

/* ============ Eventos ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-persona],[data-movfilter],[data-edit],[data-meta],[data-prestamo],[data-pmov],[data-tipo],[data-cat],[data-ptipo],[data-theme-set],[data-action]');
  if(!t)return;
  const ds=t.dataset;
  if(ds.tab){UI.tab=ds.tab;render();scrollTo(0,0);return}
  if(ds.persona!==undefined&&t.classList.contains('chip')){UI.persona=ds.persona;render();return}
  if(ds.movfilter){UI.movFilter=ds.movfilter;render();return}
  if(ds.edit){movForm(S.movs.find(m=>m.id===ds.edit));return}
  if(ds.meta){metaForm(S.metas.find(m=>m.id===ds.meta));return}
  if(ds.prestamo){prestamoDetail(ds.prestamo);return}
  if(ds.pmov){const x=S.pmovs.find(q=>q.id===ds.pmov);pmovForm(x.prestamoId,x);return}
  if(ds.tipo){readMovForm();draft.tipo=ds.tipo;if(ds.tipo==='ingreso')draft.cat=S.fuentesIngreso[0];if(ds.tipo==='gasto')draft.cat=S.categorias[0];drawMovForm(!draft.id);return}
  if(ds.cat){readMovForm();draft.cat=ds.cat;document.querySelectorAll('.catgrid button').forEach(b=>b.classList.toggle('on',b===t));return}
  if(ds.ptipo){document.querySelectorAll('#pTipoSeg button').forEach(b=>b.classList.toggle('on',b===t));const g=document.getElementById('qGasto');if(g)g.checked=ds.ptipo==='Pago';return}
  if(ds.themeSet){setTheme(ds.themeSet);render();return}
  const a=ds.action;
  if(a==='close'){closeSheet()}
  else if(a==='saveMov'){saveMov()}
  else if(a==='delMov'){if(confirm('¿Eliminar este movimiento?')){S.movs=S.movs.filter(m=>m.id!==draft.id);save();closeSheet();render();toast('Eliminado')}}
  else if(a==='dupMov'){readMovForm();draft={...draft,id:null,fecha:todayISO()};drawMovForm(true);toast('Copia lista para guardar')}
  else if(a==='newMeta'){metaForm(null)}
  else if(a==='saveMeta'){const n=document.getElementById('mNombre').value.trim();if(!n){toast('Poné un nombre');return}const o=parseAmt(document.getElementById('mObj').value);
    if(ds.id){Object.assign(S.metas.find(m=>m.id===ds.id),{nombre:n,objetivo:o})}else S.metas.push({id:uid(),nombre:n,objetivo:o});save();closeSheet();render()}
  else if(a==='delMeta'){const used=S.movs.some(m=>m.meta===ds.id);if(confirm(used?'Esta meta tiene aportes. Se eliminará la meta y sus aportes. ¿Seguro?':'¿Eliminar meta?')){S.metas=S.metas.filter(m=>m.id!==ds.id);S.movs=S.movs.filter(m=>m.meta!==ds.id);save();closeSheet();render()}}
  else if(a==='aportar'){movForm(null);readMovForm();draft.tipo='ahorro';draft.meta=ds.id;drawMovForm(true)}
  else if(a==='newPrestamo'){prestamoForm(null)}
  else if(a==='editPrestamo'){prestamoForm(S.prestamos.find(p=>p.id===ds.id))}
  else if(a==='savePrestamo'){const g=id=>document.getElementById(id).value;const n=g('pNombre').trim();if(!n){toast('Poné un nombre');return}
    const p={nombre:n,persona:g('pPersona'),original:parseAmt(g('pOrig')),cuotasTotales:parseInt(g('pCuotas'))||0,cuota:parseAmt(g('pCuota')),fin:g('pFin')};
    if(ds.id)Object.assign(S.prestamos.find(x=>x.id===ds.id),p);else S.prestamos.push({id:uid(),...p});save();closeSheet();render()}
  else if(a==='delPrestamo'){if(confirm('¿Eliminar el préstamo y todos sus movimientos?')){S.prestamos=S.prestamos.filter(p=>p.id!==ds.id);S.pmovs=S.pmovs.filter(x=>x.prestamoId!==ds.id);save();closeSheet();render()}}
  else if(a==='newPmov'){pmovForm(ds.id,null)}
  else if(a==='prestamoBack'){prestamoDetail(ds.id)}
  else if(a==='savePmov'){const g=id=>document.getElementById(id);const monto=parseAmt(g('qMonto').value);if(!monto){toast('Ingresá un monto');return}
    const tipo=document.querySelector('#pTipoSeg button.on').dataset.ptipo;
    const x={id:ds.id||uid(),prestamoId:ds.pid,fecha:g('qFecha').value||todayISO(),tipo,monto,cuotas:parseInt(g('qCuotas').value)||0,nota:g('qNota').value.trim()};
    const i=S.pmovs.findIndex(q=>q.id===x.id);if(i>=0)S.pmovs[i]=x;else S.pmovs.push(x);
    if(!ds.id&&g('qGasto')?.checked&&tipo==='Pago'){const p=S.prestamos.find(q=>q.id===ds.pid);S.movs.push({id:uid(),tipo:'gasto',fecha:x.fecha,persona:g('qPersona').value,desc:'Pago '+p.nombre,cat:S.categorias.includes('Deudas/Cuotas')?'Deudas/Cuotas':S.categorias[0],monto,medio:UI.lastMedio||S.medios[0],cuotas:'',notas:x.nota})}
    save();render();prestamoDetail(ds.pid);toast('Guardado ✓')}
  else if(a==='delPmov'){if(confirm('¿Eliminar este movimiento del préstamo?')){S.pmovs=S.pmovs.filter(q=>q.id!==ds.id);save();render();prestamoDetail(ds.pid)}}
  else if(a==='savePersonas'){const inputs=[...document.querySelectorAll('[data-persona-name]')];inputs.forEach((inp,i)=>{const nv=inp.value.trim();const old=S.personas[i];if(nv&&nv!==old){S.movs.forEach(m=>{if(m.persona===old)m.persona=nv});S.prestamos.forEach(p=>{if(p.persona===old)p.persona=nv});if(UI.persona===old)UI.persona=nv;S.personas[i]=nv}});save();render();toast('Nombres guardados')}
  else if(a==='editList'){listEditor(ds.list)}
  else if(a==='rmItem'){t.closest('.row').remove()}
  else if(a==='addItem'){const d=document.createElement('div');d.className='row';d.innerHTML='<input class="inp"><button class="iconbtn" data-action="rmItem" aria-label="Quitar">✕</button>';document.getElementById('listItems').appendChild(d);d.querySelector('input').focus()}
  else if(a==='saveList'){const key=ds.list;const old=S[key];const rows=[...document.querySelectorAll('#listItems input')];
    // renombres por posición (solo para ítems originales)
    rows.forEach((inp,i)=>{const nv=inp.value.trim();const ov=inp.defaultValue;if(ov&&nv&&nv!==ov){S.movs.forEach(m=>{if(key==='medios'){if(m.medio===ov)m.medio=nv}else if(m.cat===ov)m.cat=nv});if(CAT_ICON[ov]&&key==='categorias')CAT_ICON[nv]=CAT_ICON[ov]}});
    const vals=[...new Set(rows.map(r=>r.value.trim()).filter(Boolean))];if(!vals.length){toast('La lista no puede quedar vacía');return}
    S[key]=vals;save();closeSheet();render();toast('Lista guardada')}
  else if(a==='exportJSON'){download(`finanzas-backup-${todayISO()}.json`,JSON.stringify(S,null,1),'application/json');toast('Copia descargada')}
  else if(a==='importJSON'){document.getElementById('fileIn').click()}
  else if(a==='exportCSV'){exportCSV()}
  else if(a==='createHogar'){SYNC.create()}
  else if(a==='joinHogar'){SYNC.join(document.getElementById('joinCode').value)}
  else if(a==='shareHogar'){SYNC.share()}
  else if(a==='leaveHogar'){if(confirm('Este celular deja de sincronizar (los datos del hogar no se borran). ¿Continuar?'))SYNC.leave()}
  else if(a==='wipe'){if(confirm(window.SYNC?.hid?'¿Borrar TODOS los datos? Se borran también en el otro celular. Descargá una copia antes.':'¿Borrar TODOS los datos de este celular? Descargá una copia antes.')&&confirm('Última confirmación: se borra todo.')){S=structuredClone(DEFAULT);save();render();toast('Datos borrados')}}
});
document.getElementById('fileIn').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{importData(JSON.parse(await f.text()))}catch(err){toast('No se pudo leer el archivo')}e.target.value=''});
document.getElementById('scrim').addEventListener('click',closeSheet);
document.getElementById('fab').addEventListener('click',()=>{
  if(UI.tab==='metas')metaForm(null);else if(UI.tab==='prestamos')prestamoForm(null);else movForm(null)});
document.getElementById('prevM').addEventListener('click',()=>{UI.month=shiftMonth(UI.month,-1);render()});
document.getElementById('nextM').addEventListener('click',()=>{UI.month=shiftMonth(UI.month,1);render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Enter'&&e.target.id==='fMonto'){e.preventDefault();saveMov()}});

function setTheme(t){if(t==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;try{localStorage.setItem('finanzas.theme',t)}catch(e){}}
try{const th=localStorage.getItem('finanzas.theme');if(th&&th!=='auto')document.documentElement.dataset.theme=th}catch(e){}

render();
if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<script type="module" src="sync.js"></script>
</body>
</html>
